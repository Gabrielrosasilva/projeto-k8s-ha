---
# ==========================================================
# 1. PREPARAÇÃO: Desativar o firewall do Oracle Linux
# ==========================================================
- name: Preparar todos os nós (Desativar Firewall OS)
  hosts: k8s_cluster
  become: yes
  tasks:
    - name: Parar e desabilitar o firewalld
      systemd:
        name: firewalld
        state: stopped
        enabled: no
      ignore_errors: yes

# ==========================================================
# 2. INSTALAÇÃO DO MASTER
# ==========================================================
- name: Configurar o K3s Master Node
  hosts: master
  become: yes 
  tasks:
    - name: Atualizar IP Público automaticamente no CloudNS
      uri:
        url: "{{ lookup('env', 'CLOUDNS_URL') }}"
        method: GET
        return_content: yes
      # Só executa se a variável de ambiente não estiver vazia
      when: lookup('env', 'CLOUDNS_URL') != ''
      ignore_errors: yes

    - name: Instalar K3s no Master (Sem Traefik)
      shell: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable traefik" sh -
      args:
        creates: /usr/local/bin/k3s
      # O PULO DO GATO: Se der erro de Lock do Linux, tenta de novo!
      register: result_master
      until: result_master.rc == 0
      retries: 5
      delay: 15

    - name: Obter o token do cluster K3s
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token

    - name: Guardar o token como variável
      set_fact:
        token: "{{ node_token['content'] | b64decode | trim }}"

    - name: Obter o IP Privado do Master
      shell: hostname -I | awk '{print $1}'
      register: master_private_ip

    - name: Guardar IP Privado
      set_fact:
        master_ip: "{{ master_private_ip.stdout }}"

# ==========================================================
# 3. INSTALAÇÃO DOS WORKERS
# ==========================================================
- name: Configurar os K3s Worker Nodes
  hosts: workers
  become: yes
  tasks:
    - name: Instalar K3s Agente nos Workers e juntar ao Master
      shell: >
        curl -sfL https://get.k3s.io | K3S_URL=https://{{ hostvars[groups['master'][0]]['master_ip'] }}:6443 K3S_TOKEN={{ hostvars[groups['master'][0]]['token'] }} sh -
      args:
        creates: /usr/local/bin/k3s-agent
      # Mesma proteção de Retry para os Workers
      register: result_worker
      until: result_worker.rc == 0
      retries: 5
      delay: 15

# ==========================================================
# 4. DEPLOY DA APLICAÇÃO E INGRESS (AUTOMATIZADO)
# ==========================================================
- name: Configurar Aplicação e Ingress Controller
  hosts: master
  become: yes
  tasks:
    - name: Aguardar o Master ficar pronto
      shell: |
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        /usr/local/bin/kubectl wait --for=condition=Ready nodes --all --timeout=600s
      ignore_errors: yes

    - name: Instalar Helm CLI
      shell: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Adicionar repositórios do Nginx e Cert-Manager
      shell: |
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        # Usando o caminho absoluto do Helm para evitar erro de PATH no Ansible
        /usr/local/bin/helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
        /usr/local/bin/helm repo add jetstack https://charts.jetstack.io
        /usr/local/bin/helm repo update

    - name: Instalar Nginx Ingress via Helm
      shell: |
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        /usr/local/bin/helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx --namespace ingress-nginx --create-namespace --set controller.service.type=LoadBalancer

    - name: Instalar Cert-Manager via Helm
      shell: |
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        /usr/local/bin/helm upgrade --install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --set installCRDs=true

    - name: Aguardar o Cert-Manager iniciar
      shell: sleep 30

    - name: Enviar arquivos YAML do projeto para o Servidor Master
      copy:
        src: ../../../k8s/
        dest: /tmp/k8s/

    - name: Aplicar manifests (Whoami, Issuer, Ingress)
      shell: |
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        # Usando o caminho absoluto do Kubectl também
        /usr/local/bin/kubectl apply -f /tmp/k8s/app/whoami.yaml
        /usr/local/bin/kubectl apply -f /tmp/k8s/igress/cluster-issuer.yaml
        /usr/local/bin/kubectl apply -f /tmp/k8s/igress/whoami-ingress.yaml