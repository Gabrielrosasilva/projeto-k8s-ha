---
# ==========================================================
# 1. PREPARAÇÃO: Desativar o firewall do Oracle Linux
# ==========================================================
- name: Preparar todos os nós (Desativar Firewall OS)
  hosts: k8s_cluster
  become: yes
  tasks:
    - name: Parar e desabilitar o firewalld
      systemd:
        name: firewalld
        state: stopped
        enabled: no
      ignore_errors: yes

# ==========================================================
# 2. INSTALAÇÃO DO MASTER
# ==========================================================
- name: Configurar o K3s Master Node
  hosts: master
  become: yes 
  tasks:
    - name: Instalar K3s no Master
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Obter o token do cluster K3s
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token

    - name: Guardar o token como variável
      set_fact:
        token: "{{ node_token['content'] | b64decode | trim }}"

    - name: Obter o IP Privado do Master
      shell: hostname -I | awk '{print $1}'
      register: master_private_ip

    - name: Guardar IP Privado
      set_fact:
        master_ip: "{{ master_private_ip.stdout }}"

# ==========================================================
# 3. INSTALAÇÃO DOS WORKERS
# ==========================================================
- name: Configurar os K3s Worker Nodes
  hosts: workers
  become: yes
  tasks:
    - name: Instalar K3s Agente nos Workers e juntar ao Master
      shell: >
        curl -sfL https://get.k3s.io | K3S_URL=https://{{ hostvars[groups['master'][0]]['master_ip'] }}:6443 K3S_TOKEN={{ hostvars[groups['master'][0]]['token'] }} sh -
      args:
        creates: /usr/local/bin/k3s-agent