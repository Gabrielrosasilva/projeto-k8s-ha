name: 'Terraform OCI - Apply/Destroy'

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'O que voce quer fazer com a infraestrutura?'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

jobs:
  terraform:
    name: 'Executar Terraform e Ansible'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout do Repositorio
      uses: actions/checkout@v4

    - name: Configurar Chaves (SSH e OCI API)
      run: |
        # Usando cat EOF para preservar as quebras de linha perfeitamente
        cat << 'EOF' > infra/terraform/oci_api_key.pem
        ${{ secrets.OCI_CLI_KEY_CONTENT }}
        EOF
        
        cat << 'EOF' > infra/terraform/ssh_public_key.pub
        ${{ secrets.SSH_PUBLIC_KEY }}
        EOF
        
        cat << 'EOF' > ssh_private_key.pem
        ${{ secrets.SSH_PRIVATE_KEY }}
        EOF
        
        chmod 600 infra/terraform/oci_api_key.pem
        chmod 600 ssh_private_key.pem

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.5.7"

    - name: Terraform Init
      run: terraform init
      working-directory: infra/terraform
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: Terraform Apply
      if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
      run: terraform apply -auto-approve -var="private_key_path=oci_api_key.pem" -var="ssh_public_key_path=ssh_public_key.pub"
      working-directory: infra/terraform
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        TF_VAR_tenancy_ocid: ${{ secrets.TF_VAR_tenancy_ocid }}
        TF_VAR_user_ocid: ${{ secrets.TF_VAR_user_ocid }}
        TF_VAR_fingerprint: ${{ secrets.TF_VAR_fingerprint }}
        TF_VAR_region: ${{ secrets.TF_VAR_region }}
        TF_VAR_compartment_ocid: ${{ secrets.TF_VAR_compartment_ocid }}

    - name: Instalar Ansible no GitHub Runner
      if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
      run: sudo apt-get update && sudo apt-get install -y ansible

    - name: Executar Ansible (Instalar K3s)
      if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
      run: |
        echo "Aguardando 30 segundos para o SSH dos servidores iniciar completamente..."
        sleep 30
        export ANSIBLE_HOST_KEY_CHECKING=False
        ansible-playbook -i inventory.ini config/ansible/k3s-install.yml
        
    - name: Terraform Destroy
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'destroy'
      run: terraform destroy -auto-approve -var="private_key_path=oci_api_key.pem" -var="ssh_public_key_path=ssh_public_key.pub"
      working-directory: infra/terraform
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        TF_VAR_tenancy_ocid: ${{ secrets.TF_VAR_tenancy_ocid }}
        TF_VAR_user_ocid: ${{ secrets.TF_VAR_user_ocid }}
        TF_VAR_fingerprint: ${{ secrets.TF_VAR_fingerprint }}
        TF_VAR_region: ${{ secrets.TF_VAR_region }}
        TF_VAR_compartment_ocid: ${{ secrets.TF_VAR_compartment_ocid }}